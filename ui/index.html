<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Codex Local API</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">⌘</div><div class="brand-title" title="Local Open AI API Server">Local Open AI API Server</div><button type="button" class="sidebar-toggle" id="toggleSidebar" aria-controls="settingsForm" aria-expanded="true" aria-label="サイドバーを閉じる" title="サイドバーを閉じる"><span id="sidebarToggleIcon" aria-hidden="true">‹</span></button></div>
    <form id="settingsForm"><div class="settings-fields"><div class="dialog-heading"><div class="eyebrow">CONFIGURATION</div><h2>サーバー設定</h2></div><p class="dialog-description">設定はサーバー停止中に変更できます。変更は自動で反映されます。</p><label>AI バックエンド<select name="backend"><option value="codex">Codex app-server</option><option value="antigravity">Antigravity CLI</option></select></label><label>待ち受けポート<input name="port" type="number" min="1024" max="65535" required></label><label id="codexBinaryField">Codex 実行ファイル<input name="binary" placeholder="自動検出（/opt/homebrew/bin/codex など）"></label><label id="antigravityBinaryField" hidden>Antigravity 実行ファイル<input name="antigravityBinary" placeholder="自動検出（~/.local/bin/agy など）"></label><label>生成タイムアウト（秒）<input name="timeout" type="number" min="10" max="3600" required></label><div class="helper">モデルと推論レベルは接続テストまたは API リクエストで指定します。<br>Antigravity の推論強度はモデル名で選択してください。<br>API キーは任意の文字列を指定できます（例: local）。</div></div><p id="settingsStatus" class="helper" role="status">変更は自動で反映されます。</p></form>
  </aside>
  <main id="mainContent">
    <header class="page-header"><h1>通信モニター<span class="live-tag">LIVE</span></h1></header>
    <div id="serverError" class="error-banner" hidden></div>
    <section class="connection-bar"><div class="connection-label"><span class="connection-icon">⇄</span><div><small>OPENAI COMPATIBLE ENDPOINT</small><code id="baseURL">http://127.0.0.1:8787/v1</code></div><button class="icon-button" id="copyURL" title="エンドポイントをコピー">⧉</button></div><div class="connection-model"><span class="dot"></span><span id="modelSummary">モデル未取得</span><button class="text-button" id="refreshModels" title="モデルを再取得">↻</button></div><div class="server-controls"><div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusLabel">停止中</span></div><button class="primary" id="toggleServer">サーバーを起動</button></div></section>
    <div class="workspace">
      <aside class="playground-panel" aria-label="接続テスト"><form id="playgroundForm"><div class="dialog-heading"><h2>接続テスト</h2></div><label>モデル<select id="testModel" required></select></label><label>推論レベル<select id="testEffort"><option value="">モデルの既定値</option></select></label><label>メッセージ<textarea id="testPrompt" rows="5" required>こんにちは。接続テストです。ひとことで返事をしてください。</textarea></label><div id="testResult" class="test-result" hidden></div><div class="dialog-footer"><button class="primary" id="sendTest" type="submit">▷ リクエストを送信</button></div></form></aside>
      <section class="activity" aria-labelledby="communicationLogTitle"><header class="communication-header"><h2 id="communicationLogTitle">通信ログ</h2><div class="communication-actions"><button type="button" class="quiet" id="exportLogs">JSONエクスポート</button><button type="button" class="quiet" id="clearLogs">クリア</button></div></header><div id="communicationLog" class="communication-log" role="log" aria-label="送信メッセージとAIの応答"></div></section>
    </div>
  </main>


  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body></html>
