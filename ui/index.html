<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Local AI API Proxy</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 8V5.5A2.5 2.5 0 1 0 5.5 8H18.5A2.5 2.5 0 1 0 16 5.5V18.5A2.5 2.5 0 1 0 18.5 16H5.5A2.5 2.5 0 1 0 8 18.5V8Z"/></svg></div><div class="brand-title" title="Local AI API Proxy">Local AI API Proxy</div><button type="button" class="sidebar-toggle" id="toggleSidebar" aria-controls="settingsForm" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"><span id="sidebarToggleIcon" aria-hidden="true">‹</span></button></div>
    <form id="settingsForm"><div class="settings-fields"><div class="dialog-heading"><div class="eyebrow">CONFIGURATION</div><h2>Server Settings</h2></div><p class="dialog-description">Stop the server to edit settings. Changes are saved automatically.</p><label>AI Backend<select name="backend"><option value="codex">Codex app-server</option><option value="antigravity">Antigravity CLI</option><option value="claude">Claude Code</option></select></label><label>Port<input name="port" type="number" min="1024" max="65535" required></label><label id="codexBinaryField">Codex Executable<input name="binary" placeholder="Auto-detect (e.g. /opt/homebrew/bin/codex)"></label><label id="antigravityBinaryField" hidden>Antigravity Executable<input name="antigravityBinary" placeholder="Auto-detect (e.g. ~/.local/bin/agy)"></label><label id="claudeBinaryField" hidden>Claude Code Executable<input name="claudeBinary" placeholder="Auto-detect (e.g. ~/.local/bin/claude)"></label><label>Generation Timeout (seconds)<input name="timeout" type="number" min="10" max="3600" required></label></div><p id="settingsStatus" class="helper" role="status">Changes are saved automatically.</p></form>
  </aside>
  <main id="mainContent">
    <header class="page-header"><h1>Traffic Monitor<span class="live-tag">LIVE</span></h1></header>
    <div id="serverError" class="error-banner" hidden></div>
    <section class="connection-bar"><div class="connection-label"><span class="connection-icon">⇄</span><div><small>OPENAI COMPATIBLE ENDPOINT</small><code id="baseURL">http://127.0.0.1:8787/v1</code></div><button class="icon-button" id="copyURL" title="Copy endpoint URL">⧉</button></div><div class="connection-model"><span class="dot"></span><span id="modelSummary">Models not loaded</span><button class="text-button" id="refreshModels" title="Refresh models">↻</button></div><div class="server-controls"><div class="status-pill"><span class="dot" id="statusDot"></span><span id="statusLabel">Stopped</span></div><button class="primary" id="toggleServer">Start Server</button></div></section>
    <div class="workspace">
      <aside class="playground-panel" aria-label="Connection Test"><form id="playgroundForm"><div class="dialog-heading"><h2>Connection Test</h2></div><label>Model<select id="testModel" required></select></label><label>Reasoning Level<select id="testEffort"><option value="">Model default</option></select></label><label>Message<textarea id="testPrompt" rows="5" required>Hello! This is a connection test. Please reply briefly.</textarea></label><div id="testResult" class="test-result" hidden></div><div class="dialog-footer"><button class="primary" id="sendTest" type="submit">▷ Send Request</button></div></form></aside>
      <section class="activity" aria-labelledby="communicationLogTitle"><header class="communication-header"><h2 id="communicationLogTitle">Traffic Log</h2><div class="communication-actions"><button type="button" class="quiet" id="exportLogs">Export JSON</button><button type="button" class="quiet" id="clearLogs">Clear</button></div></header><div id="communicationLog" class="communication-log" role="log" aria-label="Request messages and AI responses"></div></section>
    </div>
  </main>


  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body></html>
